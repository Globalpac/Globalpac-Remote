<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#06306B" flood-opacity="0.32" />
    </filter>
    <filter id="mark-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#032A66" flood-opacity="0.35" />
    </filter>
    <linearGradient id="tile-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3FA8FF" />
      <stop offset="55%" stop-color="#1778EE" />
      <stop offset="100%" stop-color="#0B54CF" />
    </linearGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="head-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E3EFFF" />
    </linearGradient>
    <linearGradient id="head-b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BFE0FF" />
      <stop offset="100%" stop-color="#8CC4FF" />
    </linearGradient>
    <clipPath id="tile-clip">
      <rect x="56" y="56" width="400" height="400" rx="100" />
    </clipPath>
  </defs>

  <!-- Base do icone -->
  <rect x="56" y="56" width="400" height="400" rx="100" fill="url(#tile-grad)" filter="url(#tile-shadow)" />
  <g clip-path="url(#tile-clip)">
    <rect x="56" y="56" width="400" height="200" fill="url(#gloss)" />
  </g>

  <!-- Marca: dois ponteiros ponta a ponta -->
  <g filter="url(#mark-shadow)" stroke-linejoin="round" stroke-width="14">
    <polygon points="242.0,242.0 130.0,130.0 202.0,118.0 242.0,82.0" fill="url(#head-b)" stroke="#A4D0FF" />
    <polygon points="270.0,270.0 382.0,382.0 310.0,394.0 270.0,430.0" fill="url(#head-a)" stroke="#F1F7FF" />
  </g>
</svg>
