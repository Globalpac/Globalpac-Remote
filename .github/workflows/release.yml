name: Publicar release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID da corrida que gerou o artefato
        required: true
        type: string
      platform:
        description: windows ou linux
        required: false
        type: string
        default: windows
  workflow_run:
    workflows: ["Cliente Windows Globalpac", "Cliente Linux Globalpac"]
    types: [completed]

permissions:
  actions: read
  contents: write

env:
  VERSION: "1.5.6"

jobs:
  release:
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.platform == 'windows') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.name == 'Cliente Windows Globalpac')
    runs-on: ubuntu-latest
    steps:
      - name: Baixar exe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Globalpac-${{ env.VERSION }}-x86_64
          path: dist
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          name: Globalpac ${{ env.VERSION }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/Globalpac-${{ env.VERSION }}-x86_64.exe
            dist/Globalpac-Suporte-${{ env.VERSION }}-x86_64.exe
            dist/Globalpac-Suporte-Portatil-${{ env.VERSION }}-x86_64.exe
            dist/Globalpac-Suporte-Setup.exe
            dist/Globalpac-Suporte-Portatil.exe
            dist/Globalpac-Acesso-${{ env.VERSION }}-x86_64.exe
            dist/Globalpac-Acesso-Setup.exe
          body: |
            Cliente Windows da Globalpac ${{ env.VERSION }}, baseado no RustDesk 1.5.0 (AGPL-3.0).

            Servidor gravado: rustdesk.globalpac.com.br

            - `Globalpac-Suporte` é para o cliente externo. Mostra o ID e a senha de uso único. Não liga a outros computadores. Instala em `C:\Program Files\RustDesk-Globalpac-Suporte` e convive com o cliente completo no mesmo PC.
            - `Globalpac-Suporte-Portatil` é o mesmo Suporte sem instalação: só abre, mostra o ID e a senha e fecha.
            - `Globalpac-Acesso` é o acesso não assistido, para o TI instalar no computador e entrar depois com a senha permanente definida na instalação. Instala em `C:\Program Files\RustDesk-Globalpac-Acesso` e convive com os outros clientes no mesmo PC.
            - `Globalpac` é o cliente completo, para a equipe. Instala em `C:\Program Files\RustDesk-Globalpac`.

            O programa instalado busca a próxima release neste repositório e se substitui, pelo arquivo com versão no nome. O rodapé diz Desenvolvido por Globalpac. Não está assinado, por isso o SmartScreen avisa na primeira abertura.

            Links estáveis, que apontam para a última release:
            - Instalável: https://github.com/Globalpac/Globalpac-Remote/releases/latest/download/Globalpac-Suporte-Setup.exe
            - Portátil: https://github.com/Globalpac/Globalpac-Remote/releases/latest/download/Globalpac-Suporte-Portatil.exe
            - Acesso: https://github.com/Globalpac/Globalpac-Remote/releases/latest/download/Globalpac-Acesso-Setup.exe
            - Linux (AppImage): https://github.com/Globalpac/Globalpac-Remote/releases/latest/download/Globalpac-Suporte.AppImage

            Código: https://github.com/Globalpac/Globalpac-Remote e https://github.com/rustdesk/rustdesk/tree/1.5.0

  release-linux:
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.platform == 'linux') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.name == 'Cliente Linux Globalpac')
    runs-on: ubuntu-latest
    steps:
      - name: Baixar AppImage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Globalpac-Suporte-${{ env.VERSION }}-x86_64-AppImage
          path: dist
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Anexar AppImage à release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/Globalpac-Suporte-${{ env.VERSION }}-x86_64.AppImage
            dist/Globalpac-Suporte.AppImage